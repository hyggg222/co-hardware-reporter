<!DOCTYPE html>
<html>
    <head>
        <title>System Report</title>
    </head>

    <body>
        <div id="cpu">
            <p id="cpu-base">
                <!--count & model filled in automatically-->
            </p>
            <table id="cpu-loads">
                <!--loads & average filled in automatically-->
            </table>
        </div>

        <div id="pci">
            <p id="pci-base">
                <!--count filled in automatically-->
            </p>
            <table id="pci-devices">
                <!--devices filled in automatically-->
            </table>
        </div>

        <div id="usb">
            <p id="usb-base">
                <!--count filled in automatically-->
            </p>
            <table id="usb-devices">
                <!--devices filled in automatically-->
            </table>
        </div>

        <p id="memory">
            <!--total, used & percentage filled in automatically-->
        </p>
    </body>

    
    <script src="src/report.js"></script>
</html>
